<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Data Pipeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 30px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #888;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-name {
            font-size: 14px;
            color: #ccc;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active .status-dot {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        .status-inactive .status-dot {
            background: #888;
        }

        .status-error .status-dot {
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
        }

        .error-log {
            background: #111;
            border-radius: 4px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .error-log::-webkit-scrollbar {
            width: 6px;
        }

        .error-log::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .error-log::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .error-entry {
            padding: 4px 0;
            color: #ff8866;
        }

        .error-time {
            color: #666;
            margin-right: 10px;
        }

        .query-section {
            grid-column: 1 / -1;
        }

        .query-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff88;
        }

        button {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #00dd77;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .results {
            background: #111;
            border-radius: 6px;
            padding: 20px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .answer {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #fff;
        }

        .sources {
            margin-top: 20px;
        }

        .source-item {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .source-url {
            font-size: 11px;
            color: #00ff88;
            text-decoration: none;
            word-break: break-all;
        }

        .source-text {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 2px solid #2a2a2a;
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            font-size: 11px;
            color: #555;
            text-align: right;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Education Data Pipeline Dashboard</h1>

        <div class="grid">
            <div class="card">
                <h2>System Status</h2>
                <div id="status-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Checking systems...
                    </div>
                </div>
                <div class="timestamp" id="status-timestamp"></div>
            </div>

            <div class="card">
                <h2>Error Log</h2>
                <div class="error-log" id="error-log">
                    <div class="empty-state">No errors</div>
                </div>
            </div>

            <div class="card query-section">
                <h2>Query Interface</h2>
                <form class="query-form" id="query-form">
                    <input
                        type="text"
                        id="query-input"
                        placeholder="e.g., Does Harvard have mental health services?"
                        required
                    >
                    <button type="submit" id="submit-btn">Search</button>
                </form>

                <div class="results" id="results">
                    <div class="answer" id="answer"></div>
                    <div class="sources" id="sources"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update system status
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                const statusList = document.getElementById('status-list');
                statusList.innerHTML = '';

                for (const [key, component] of Object.entries(data.components)) {
                    const item = document.createElement('div');
                    item.className = 'status-item';
                    item.innerHTML = `
                        <div class="status-name">${component.name}</div>
                        <div class="status-badge status-${component.status}">
                            <span>${component.message}</span>
                            <div class="status-dot"></div>
                        </div>
                    `;
                    statusList.appendChild(item);
                }

                document.getElementById('status-timestamp').textContent =
                    'Updated: ' + data.timestamp;

            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }

        // Update error log
        async function updateErrors() {
            try {
                const response = await fetch('/api/errors');
                const errors = await response.json();

                const errorLog = document.getElementById('error-log');

                if (errors.length === 0) {
                    errorLog.innerHTML = '<div class="empty-state">No errors</div>';
                } else {
                    errorLog.innerHTML = errors.map(err =>
                        `<div class="error-entry">
                            <span class="error-time">${err.timestamp}</span>
                            ${err.level}: ${err.message}
                        </div>`
                    ).join('');
                    errorLog.scrollTop = errorLog.scrollHeight;
                }
            } catch (error) {
                console.error('Failed to update errors:', error);
            }
        }

        // Handle query submission
        document.getElementById('query-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const input = document.getElementById('query-input');
            const submitBtn = document.getElementById('submit-btn');
            const results = document.getElementById('results');
            const answer = document.getElementById('answer');
            const sources = document.getElementById('sources');

            const query = input.value.trim();
            if (!query) return;

            // Show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            results.classList.add('show');
            answer.innerHTML = '<div class="loading"><div class="spinner"></div>Processing query...</div>';
            sources.innerHTML = '';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();

                if (data.error) {
                    answer.innerHTML = `<div style="color: #ff4444;">Error: ${data.error}</div>`;
                } else {
                    answer.textContent = data.answer;

                    if (data.sources && data.sources.length > 0) {
                        sources.innerHTML = '<h3 style="font-size: 12px; color: #888; margin-bottom: 10px;">SOURCES</h3>' +
                            data.sources.map(src =>
                                `<div class="source-item">
                                    <a href="${src.url}" target="_blank" class="source-url">${src.url}</a>
                                    <div class="source-text">${src.text}</div>
                                </div>`
                            ).join('');
                    }
                }

            } catch (error) {
                answer.innerHTML = `<div style="color: #ff4444;">Error: ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Search';
            }
        });

        // Initial load and periodic updates
        updateStatus();
        updateErrors();

        setInterval(updateStatus, 10000);  // Update status every 10s
        setInterval(updateErrors, 2000);    // Update errors every 2s
    </script>
</body>
</html>
