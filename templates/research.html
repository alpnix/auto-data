<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
        }

        .header-actions a {
            color: #00ff88;
            text-decoration: none;
            font-size: 13px;
        }

        .header-actions a:hover {
            text-decoration: underline;
        }

        .controls {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .model-selector label {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        .model-selector select {
            background: #111;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            min-width: 160px;
        }

        .model-selector select:focus {
            border-color: #00ff88;
        }

        .model-selector select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .model-badge {
            font-size: 11px;
            color: #00ff88;
            background: #0a1f14;
            border: 1px solid #00ff8833;
            border-radius: 4px;
            padding: 3px 8px;
            white-space: nowrap;
        }

        button {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #00dd77;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #111;
            border-radius: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.running {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.complete {
            background: #4488ff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .entity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .entity-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
        }

        .entity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }

        .entity-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .entity-meta {
            font-size: 12px;
            color: #888;
        }

        .process-badge {
            background: #111;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            color: #00ff88;
            white-space: nowrap;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            background: #111;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #00ff88, #00dd77);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .search-log {
            background: #111;
            border-radius: 6px;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .search-log::-webkit-scrollbar {
            width: 6px;
        }

        .search-log::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .search-log::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .log-entry {
            padding: 3px 0;
            color: #aaa;
        }

        .log-entry.success { color: #00ff88; }
        .log-entry.info { color: #4488ff; }
        .log-entry.warning { color: #ffaa44; }

        .log-time {
            color: #555;
            margin-right: 8px;
        }

        .results-section {
            background: #111;
            border-radius: 6px;
            padding: 15px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .accuracy-bar {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 11px;
        }

        .result-field {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .result-field:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 13px;
            color: #fff;
        }

        .result-value.unknown {
            color: #666;
            font-style: italic;
        }

        .expected-value {
            font-size: 10px;
            color: #555;
            margin-top: 4px;
        }

        .f1-score {
            color: #666;
            font-size: 9px;
            margin-left: 8px;
        }

        .stats-bar {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px 20px;
            display: none;
            justify-content: space-around;
            text-align: center;
        }

        .stats-bar.show {
            display: flex;
        }

        .stat {
            flex: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #00ff88;
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .saved-info {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .saved-info.show {
            display: block;
        }

        .saved-title {
            font-size: 14px;
            font-weight: 600;
            color: #00ff88;
            margin-bottom: 12px;
        }

        .saved-path {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
            background: #111;
            padding: 10px;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 40px 20px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 2px solid #2a2a2a;
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .config-info {
            font-size: 12px;
            color: #666;
            margin-left: auto;
        }

        a {
            color: #00ff88;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="page-title">Research Dashboard</h1>
                <p class="subtitle" id="page-subtitle">Loading configuration...</p>
            </div>
            <div class="header-actions">
                <a href="/setup">← Back to Setup</a>
            </div>
        </header>

        <div class="controls">
            <button id="start-btn" onclick="startProcess()" disabled>Start Research</button>
            <div class="status-badge">
                <div class="status-dot" id="status-indicator"></div>
                <span id="status-text">Loading...</span>
            </div>
            <div class="config-info" id="config-info"></div>
            <div class="model-selector">
                <label for="model-select">Model</label>
                <select id="model-select" disabled>
                    <option value="">Loading...</option>
                </select>
                <span class="model-badge" id="model-badge" style="display:none"></span>
            </div>
        </div>

        <div class="entity-grid" id="entity-grid">
            <div class="loading">
                <div class="spinner"></div>
                Loading configuration...
            </div>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat">
                <span class="stat-value" id="total-docs">0</span>
                <span class="stat-label">Total Documents</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="total-sources">0</span>
                <span class="stat-label">Unique Sources</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="completion-pct">0%</span>
                <span class="stat-label">Completion</span>
            </div>
        </div>

        <div class="saved-info" id="saved-info">
            <div class="saved-title">Results Saved</div>
            <div class="saved-path" id="saved-path"></div>
        </div>
    </div>

    <script>
        let config = null;
        let eventSource = null;
        let isRunning = false;

        // Load models and configuration on page load
        async function loadModels() {
            try {
                const res = await fetch('/api/models');
                const data = await res.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '';
                if (!data.models || data.models.length === 0) {
                    select.innerHTML = '<option value="">No models available</option>';
                    return;
                }
                data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.label;
                    if (m.id === data.default) opt.selected = true;
                    select.appendChild(opt);
                });
                select.disabled = false;
            } catch (e) {
                document.getElementById('model-select').innerHTML = '<option value="">Error loading models</option>';
            }
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                config = await response.json();

                if (config.error) {
                    document.getElementById('entity-grid').innerHTML =
                        `<div class="empty-state">Error loading config: ${config.error}<br><a href="/setup">Go to Setup</a></div>`;
                    return;
                }

                // Update page title
                document.getElementById('page-title').textContent =
                    config.dataset_name || 'Research Dashboard';
                document.getElementById('page-subtitle').textContent =
                    config.dataset_description || 'Research data collection pipeline';

                // Update config info
                const entityCount = config.entities?.length || 0;
                const fieldCount = config.fields?.length || 0;
                document.getElementById('config-info').textContent =
                    `${entityCount} entities, ${fieldCount} fields`;

                // Setup entity cards
                if (config.entities && config.entities.length > 0) {
                    setupEntityCards(config.entities);
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('status-text').textContent = 'Ready';
                } else {
                    document.getElementById('entity-grid').innerHTML =
                        `<div class="empty-state">No entities configured.<br><a href="/setup">Go to Setup</a></div>`;
                }

            } catch (error) {
                document.getElementById('entity-grid').innerHTML =
                    `<div class="empty-state">Failed to load config: ${error.message}<br><a href="/setup">Go to Setup</a></div>`;
            }
        }

        function setupEntityCards(entities) {
            const grid = document.getElementById('entity-grid');
            grid.innerHTML = entities.map((entity, index) => createEntityCard(entity, index)).join('');
        }

        function createEntityCard(entity, index) {
            // Get display name from entity object
            const values = Object.values(entity);
            const name = values[0] || `Entity ${index + 1}`;
            const meta = values.slice(1).filter(v => v).join(' | ');

            return `
                <div class="entity-card" id="card-${index}">
                    <div class="entity-header">
                        <div>
                            <div class="entity-name">${name}</div>
                            <div class="entity-meta">${meta}</div>
                        </div>
                        <div class="process-badge" id="badge-${index}">Pending</div>
                    </div>

                    <div class="progress-section">
                        <div class="progress-label">Progress</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="progress-${index}"></div>
                        </div>
                    </div>

                    <div class="search-log" id="log-${index}">
                        <div class="log-entry" style="color: #555;">Waiting to start...</div>
                    </div>

                    <div class="results-section" id="results-${index}">
                        <div id="extracted-${index}"></div>
                    </div>
                </div>
            `;
        }

        function addLog(index, message, type = 'info') {
            const log = document.getElementById(`log-${index}`);
            if (!log) return;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-time">${time}</span>${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function updateProgress(index, percent) {
            const bar = document.getElementById(`progress-${index}`);
            if (bar) bar.style.width = `${percent}%`;
        }

        function updateBadge(index, text) {
            const badge = document.getElementById(`badge-${index}`);
            if (badge) badge.textContent = text;
        }

        function displayResults(index, data) {
            const resultsDiv = document.getElementById(`results-${index}`);
            const extractedDiv = document.getElementById(`extracted-${index}`);
            if (!resultsDiv || !extractedDiv) return;

            const evaluation = data.evaluation;
            const configFields = config.fields || [];
            const groundTruth = config.ground_truth || {};

            // Get entity for ground truth lookup - use primary field from schema
            const entity = config.entities[index];
            const entitySchema = config.entity_schema || {};
            const primaryField = entitySchema.primary_field || Object.keys(entity || {})[0];
            const entityName = entity ? entity[primaryField] : null;
            const truth = groundTruth[entityName];

            let html = '';

            // Show accuracy summary if evaluation available
            if (evaluation && evaluation.summary) {
                const s = evaluation.summary;
                const accuracy = s.overall_accuracy ? (s.overall_accuracy * 100).toFixed(0) : 'N/A';
                html += `
                    <div class="accuracy-bar">
                        <span style="color: #00ff88;">Accuracy: ${accuracy}%</span>
                        <span style="margin-left: 15px;">🟢 ${s.exact_matches}</span>
                        <span style="margin-left: 10px;">🟡 ${s.semantic_matches}</span>
                        <span style="margin-left: 10px;">🔴 ${s.misses + s.missing}</span>
                    </div>
                `;
            }

            // Build field list: use extracted data keys, map to config labels where possible
            const extractedKeys = Object.keys(data).filter(k =>
                !['error', 'evaluation', 'documents', 'sources'].includes(k)
            );

            // Create a map from config for labels
            const configFieldMap = {};
            configFields.forEach(f => {
                configFieldMap[f.key] = f.label;
            });

            // Display each extracted field
            extractedKeys.forEach(key => {
                const extracted = data[key];

                // Skip null/undefined
                if (extracted === null || extracted === undefined) return;

                // Get label from config or generate from key
                let label = configFieldMap[key];
                if (!label) {
                    // Generate label from key
                    label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                }

                // Get expected value
                let expected = truth ? truth[key] : null;

                // Get evaluation data
                let symbol = '';
                let f1Score = null;
                if (evaluation && evaluation.fields) {
                    let fieldEval = evaluation.fields[key];
                    if (fieldEval) {
                        symbol = fieldEval.symbol || '';
                        f1Score = fieldEval.f1_score;
                    }
                }

                // Check if value indicates "unknown"
                const isUnknown = !extracted ||
                    extracted === 'Unknown' ||
                    extracted === 'Not available' ||
                    extracted === 'Unable to retrieve';

                // Check if it's a URL field
                const isUrl = key.includes('url') || key.includes('link') ||
                    (typeof extracted === 'string' && extracted.startsWith('http'));

                html += `
                    <div class="result-field">
                        <div class="result-label">
                            ${label} ${symbol}
                            ${f1Score !== null && f1Score !== undefined ? `<span class="f1-score">F1: ${f1Score.toFixed(2)}</span>` : ''}
                        </div>
                        <div class="result-value ${isUnknown ? 'unknown' : ''}">
                            ${isUrl && !isUnknown
                                ? `<a href="${extracted}" target="_blank">${extracted}</a>`
                                : (extracted || 'Unknown')}
                        </div>
                        ${expected && expected !== 'Not available' ? `<div class="expected-value">Expected: ${expected}</div>` : ''}
                    </div>
                `;
            });

            extractedDiv.innerHTML = html;
            resultsDiv.classList.add('show');
        }

        function startProcess() {
            if (isRunning || !config) return;

            const modelSelect = document.getElementById('model-select');
            const selectedModel = modelSelect.value;
            modelSelect.disabled = true;

            // Show active model badge
            const badge = document.getElementById('model-badge');
            badge.textContent = modelSelect.options[modelSelect.selectedIndex]?.text || selectedModel;
            badge.style.display = 'inline';

            isRunning = true;
            document.getElementById('start-btn').disabled = true;
            document.getElementById('status-indicator').classList.add('running');
            document.getElementById('status-text').textContent = 'Running';
            document.getElementById('stats-bar').classList.add('show');

            // Reset cards
            setupEntityCards(config.entities);

            // Start SSE connection with selected model
            const url = `/api/research/process${selectedModel ? '?model=' + encodeURIComponent(selectedModel) : ''}`;
            eventSource = new EventSource(url);

            eventSource.addEventListener('start', (e) => {
                const data = JSON.parse(e.data);
                const log = document.getElementById(`log-${data.index}`);
                if (log) log.innerHTML = '';
                addLog(data.index, `Starting research...`, 'info');
                updateBadge(data.index, 'Processing');
            });

            eventSource.addEventListener('search', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, `Searching: ${data.description}`, 'info');
                updateProgress(data.index, data.progress);
            });

            eventSource.addEventListener('result', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, `Found ${data.count} results`, 'success');
            });

            eventSource.addEventListener('scraping', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, `Scraping: ${data.url}...`, 'info');
            });

            eventSource.addEventListener('storing', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, `Storing ${data.count} documents`, 'success');
            });

            eventSource.addEventListener('extracting', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, 'Extracting information...', 'info');
            });

            eventSource.addEventListener('complete', (e) => {
                const data = JSON.parse(e.data);
                addLog(data.index, `Complete! ${data.documents} docs`, 'success');
                updateBadge(data.index, 'Complete');
                updateProgress(data.index, 100);
                displayResults(data.index, data.extracted_info);
            });

            eventSource.addEventListener('stats', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('total-docs').textContent = data.total_documents;
                document.getElementById('total-sources').textContent = data.unique_sources;
                document.getElementById('completion-pct').textContent = data.completion + '%';
            });

            eventSource.addEventListener('done', (e) => {
                document.getElementById('status-indicator').classList.remove('running');
                document.getElementById('status-indicator').classList.add('complete');
                document.getElementById('status-text').textContent = 'Complete';
            });

            eventSource.addEventListener('saved', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('saved-path').textContent = data.session_folder;
                document.getElementById('saved-info').classList.add('show');
                eventSource.close();
                isRunning = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('model-select').disabled = false;
            });

            eventSource.addEventListener('error', (e) => {
                try {
                    const data = JSON.parse(e.data);
                    document.getElementById('status-text').textContent = 'Error: ' + data.error;
                } catch {
                    document.getElementById('status-text').textContent = 'Connection error';
                }
                eventSource.close();
                isRunning = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('model-select').disabled = false;
            });

            eventSource.onerror = () => {
                document.getElementById('status-indicator').classList.remove('running');
                document.getElementById('status-text').textContent = 'Disconnected';
                isRunning = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('model-select').disabled = false;
            };
        }

        // Initialize
        loadModels();
        loadConfig();
    </script>
</body>
</html>
